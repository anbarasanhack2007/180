name: cybersprint180
description: CyberSprint 180 - 180 Days. One Skillset. A Cybersecurity Career.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Storage & Cache
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Networking & Connectivity
  connectivity_plus: ^6.1.4

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # URL & External Links
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.14.2

  # Notifications (local)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Icons
  flutter_launcher_icons: ^0.14.3

  # Other
  equatable: ^2.0.7
  dartz: ^0.10.1
  rxdart: ^0.28.0
  collection: ^1.19.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.3
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
